<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="900" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0DEB8"/>
      <stop offset=".24" stop-color="#C79B57"/>
      <stop offset=".5" stop-color="#E5C98D"/>
      <stop offset=".76" stop-color="#B88442"/>
      <stop offset="1" stop-color="#E5C98D"/>
    </linearGradient>
    <linearGradient id="leafGold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4E7CA"/>
      <stop offset=".45" stop-color="#D5B777"/>
      <stop offset="1" stop-color="#A9783E"/>
    </linearGradient>
    <linearGradient id="leafIvory" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF8EA"/>
      <stop offset="1" stop-color="#DFC79A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#8A5D27" flood-opacity=".18"/>
    </filter>

    <g id="leaf">
      <path d="M0 0 C12 -18 30 -22 44 -10 C38 8 20 17 0 0Z" fill="url(#leafIvory)" stroke="#C59A58" stroke-width="1.7"/>
      <path d="M4 -1 C18 -4 29 -7 39 -10" stroke="#B88745" stroke-width="1" opacity=".65"/>
    </g>

    <g id="leaf2">
      <path d="M0 0 C7 -21 24 -31 40 -23 C42 -4 27 10 0 0Z" fill="url(#leafGold)" stroke="#B47F3D" stroke-width="1.6"/>
      <path d="M3 -1 C13 -7 25 -14 35 -20" stroke="#A56F34" stroke-width="1" opacity=".6"/>
    </g>

    <g id="scroll">
      <path d="M0 0 C26 -22 44 -13 39 6 C34 25 5 29 7 8 C9 -7 32 -8 31 6" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g id="topCorner" filter="url(#glow)">
      <path d="M16 156 C24 115 38 76 74 43 C98 21 125 15 163 16" stroke="url(#gold)" stroke-width="5.2" stroke-linecap="round"/>
      <path d="M28 133 C56 98 88 76 128 62" stroke="#C99E5B" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
      <use href="#leaf2" transform="translate(26 127) rotate(-82) scale(.95)"/>
      <use href="#leaf" transform="translate(43 103) rotate(-64) scale(.9)"/>
      <use href="#leaf2" transform="translate(61 82) rotate(-48) scale(.82)"/>
      <use href="#leaf" transform="translate(84 61) rotate(-27) scale(.84)"/>
      <use href="#leaf2" transform="translate(111 43) rotate(-10) scale(.77)"/>
      <use href="#leaf" transform="translate(140 30) rotate(8) scale(.68)"/>
      <use href="#scroll" transform="translate(31 126) rotate(-62) scale(.7)"/>
      <circle cx="51" cy="119" r="4.2" fill="#C28F4A"/>
      <circle cx="75" cy="90" r="3.4" fill="#E2C58C"/>
      <circle cx="103" cy="61" r="3" fill="#BA8542"/>
    </g>

    <g id="bottomCorner" filter="url(#glow)">
      <path d="M17 7 C26 55 46 104 88 139 C112 159 140 169 177 172" stroke="url(#gold)" stroke-width="5.2" stroke-linecap="round"/>
      <path d="M33 37 C60 75 91 103 135 119" stroke="#C99E5B" stroke-width="2.5" stroke-linecap="round" opacity=".86"/>
      <use href="#leaf2" transform="translate(27 43) rotate(72) scale(.98)"/>
      <use href="#leaf" transform="translate(48 69) rotate(54) scale(.93)"/>
      <use href="#leaf2" transform="translate(70 91) rotate(38) scale(.88)"/>
      <use href="#leaf" transform="translate(98 112) rotate(21) scale(.86)"/>
      <use href="#leaf2" transform="translate(128 129) rotate(4) scale(.78)"/>
      <use href="#leaf" transform="translate(158 140) rotate(-10) scale(.66)"/>
      <use href="#scroll" transform="translate(33 47) rotate(55) scale(.72)"/>
      <circle cx="52" cy="63" r="4.2" fill="#C28F4A"/>
      <circle cx="80" cy="92" r="3.4" fill="#E2C58C"/>
      <circle cx="111" cy="118" r="3" fill="#BA8542"/>
    </g>

    <g id="sideMedallion">
      <path d="M0 -28 L17 -12 L28 0 L17 12 L0 28 L-17 12 L-28 0 L-17 -12 Z" fill="url(#leafGold)" stroke="#A97639" stroke-width="2"/>
      <path d="M0 -18 L11 -8 L18 0 L11 8 L0 18 L-11 8 L-18 0 L-11 -8 Z" fill="#F3E1BB" fill-opacity=".68" stroke="#C29855" stroke-width="1.2"/>
      <circle r="4" fill="#B88240"/>
    </g>
  </defs>

  <!-- double metallic border -->
  <rect x="27" y="27" width="846" height="1146" rx="12" stroke="url(#gold)" stroke-width="4"/>
  <rect x="43" y="43" width="814" height="1114" rx="9" stroke="#D7B979" stroke-width="1.6" opacity=".92"/>

  <!-- mosque-inspired top arch -->
  <path d="M44 103 H287 C335 103 366 88 392 59 C414 34 430 16 450 10 C470 16 486 34 508 59 C534 88 565 103 613 103 H856"
        stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M357 100 C388 94 404 77 419 58 C430 44 440 33 450 29 C460 33 470 44 481 58 C496 77 512 94 543 100"
        stroke="#E2C78D" stroke-width="2" opacity=".9"/>
  <path d="M450 18 L466 40 L450 62 L434 40 Z" fill="url(#leafGold)" stroke="#A87336" stroke-width="1.8"/>
  <circle cx="450" cy="40" r="4.5" fill="#F2E2C1" stroke="#B78240" stroke-width="1"/>

  <!-- lush top botanical corners -->
  <g transform="translate(33 37)"><use href="#topCorner"/></g>
  <g transform="translate(867 37) scale(-1 1)"><use href="#topCorner"/></g>

  <!-- long side rails -->
  <path d="M50 150 V1036" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M62 173 V1015" stroke="#D9BD82" stroke-width="1.5" opacity=".9"/>
  <path d="M850 150 V1036" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M838 173 V1015" stroke="#D9BD82" stroke-width="1.5" opacity=".9"/>

  <!-- side medallions -->
  <g transform="translate(50 600)"><use href="#sideMedallion"/></g>
  <g transform="translate(850 600)"><use href="#sideMedallion"/></g>

  <!-- lush bottom botanical corners -->
  <g transform="translate(33 988)"><use href="#bottomCorner"/></g>
  <g transform="translate(867 988) scale(-1 1)"><use href="#bottomCorner"/></g>

  <!-- bottom rail and central flourish -->
  <path d="M43 1115 H330 C374 1115 401 1125 423 1144 C434 1154 442 1160 450 1163 C458 1160 466 1154 477 1144 C499 1125 526 1115 570 1115 H857"
        stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M450 1136 L468 1152 L450 1168 L432 1152 Z" fill="url(#leafGold)" stroke="#A87336" stroke-width="1.8"/>
  <path d="M420 1152 C431 1145 439 1142 450 1142 C461 1142 469 1145 480 1152" stroke="#E8D5AA" stroke-width="1.5"/>

  <!-- tiny inward flourishes that echo the generated artwork -->
  <path d="M66 213 C89 198 112 193 139 196" stroke="#D7B979" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>
  <path d="M834 213 C811 198 788 193 761 196" stroke="#D7B979" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>
  <path d="M66 987 C89 1002 112 1007 139 1004" stroke="#D7B979" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>
  <path d="M834 987 C811 1002 788 1007 761 1004" stroke="#D7B979" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>
</svg>
